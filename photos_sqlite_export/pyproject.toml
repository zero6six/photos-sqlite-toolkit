# photos-sqlite-export 的打包元数据。
# 本工具设计为从源码目录直接运行（photos_export.py 与 catalog.json 同目录，
# 复制这两个文件即可在取证现场使用），不提供 pip 安装入口；
# 此文件仅用于声明版本、许可证等元信息。改版本时与 photos_export.py 的
# __version__ 保持同步（见 ../CONTRIBUTING.md）。

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "photos-sqlite-export"
version = "0.1.0"
description = "Export any iOS Photos.sqlite to CSV without knowing the iOS version"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "zero6six" }]
keywords = ["ios", "forensics", "dfir", "photos", "sqlite", "csv"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
]
